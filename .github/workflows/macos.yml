# Build and package AudioTag for macOS.
#
# Two ad-hoc-signed (not notarized) variants. Asset names include the version
# from the app's Info.plist (Project.swift MARKETING_VERSION). On v* tags that
# is AudioTag-<version>-arm64.zip; on other builds a short SHA is appended.
# The Homebrew cask in foyoodo/homebrew-tap should match these names.
# On v* tags the release job also signs Sparkle's appcast.xml from the
# universal zip when SPARKLE_ED_PRIVATE_KEY is set.
#
# Assumptions:
#   - macos-26 (Apple Silicon) with Xcode 26.x. The project requires Xcode 26
#     (Swift 6 + Icon Composer). Tuist.swift allows 26 and 27.
#   - TagLib-Swift and upstream TagLib are public git submodules (HTTPS).
#   - No Apple signing secrets. The app is ad-hoc signed after the build, with
#     the sandbox entitlements Tuist generates, so a quarantined download is
#     "unidentified developer", not "damaged". Developer ID / notarization can
#     be added later via secrets.

name: macOS build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pin to the current default on macos-26; fallback is handled in the job.
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: arm64
            archs: arm64
          - variant: universal
            archs: arm64 x86_64

    env:
      VARIANT: ${{ matrix.variant }}
      ARCHS_VALUE: ${{ matrix.archs }}
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # TagLib-Swift and its nested taglib submodule both use HTTPS URLs
          # in .gitmodules, so no git@github.com → HTTPS rewrite is needed.
          submodules: recursive

      - name: Confirm TagLib sources
        run: |
          git submodule status --recursive
          test -f Frameworks/TagLib-Swift/Sources/CTagLib/taglib/taglib/tag.h
          test -f Frameworks/TagLib-Swift/Package.swift

      - name: Cache identity
        id: cache-meta
        run: |
          sha="$(git submodule status --recursive | awk '{print $1}' | tr -d '\n')"
          echo "submodules=$sha" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          if [[ -d "$XCODE_APP" ]]; then
            sudo xcode-select -s "$XCODE_APP"
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install Tuist
        uses: jdx/mise-action@v3
        with:
          install_args: tuist
          cache: true

      - name: Cache Tuist / SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            Tuist/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-tuist-spm-${{ hashFiles('mise.toml', 'Tuist/Package.swift', 'Frameworks/TagLib-Swift/Package.swift') }}-${{ steps.cache-meta.outputs.submodules }}
          restore-keys: |
            ${{ runner.os }}-tuist-spm-${{ hashFiles('mise.toml', 'Tuist/Package.swift', 'Frameworks/TagLib-Swift/Package.swift') }}-
            ${{ runner.os }}-tuist-spm-

      - name: Install Swift packages
        run: tuist install

      - name: Generate the Xcode workspace
        run: tuist generate --no-open --cache-profile none

      - name: Build
        run: |
          set -euo pipefail

          # Empty EXCLUDED_ARCHS so Apple Silicon runners don't drop x86_64
          # from the universal build. arm64-only excludes Intel.
          # Do not pass -arch: xcodebuild rejects it with -destination.
          if [[ "$VARIANT" == "arm64" ]]; then
            EXCLUDED="x86_64"
          else
            EXCLUDED=""
          fi

          xcodebuild build \
            -workspace AudioTag.xcworkspace \
            -scheme AudioTag \
            -configuration Release \
            -destination generic/platform=macOS \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS="$ARCHS_VALUE" \
            EXCLUDED_ARCHS="$EXCLUDED" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_ACTIVE_RESOURCES_ONLY=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            | xcbeautify --quieter

      - name: Package and verify architectures
        id: package
        env:
          APP_PATH: ${{ env.DERIVED_DATA }}/Build/Products/Release/AudioTag.app
        run: bash scripts/ci-package-macos.sh

      - name: Upload ${{ matrix.variant }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset_stem }}
          path: |
            dist/${{ steps.package.outputs.asset_stem }}.zip
            dist/${{ steps.package.outputs.asset_stem }}.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    # generate_appcast is a macOS binary from the Sparkle distribution.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: AudioTag-*
          merge-multiple: true
          path: dist

      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bash scripts/ci-generate-appcast.sh

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
